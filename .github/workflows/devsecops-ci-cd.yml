name: Capstone TaskBoard DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 1. Test & Build (pytest & Node)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Run Backend Pytest Suite
      run: |
        cd capstone-project/backend
        pip install -r requirements.txt
        pytest -v

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Build Frontend Assets
      run: |
        cd capstone-project/frontend
        npm install
        npm run build

  build-scan-push:
    name: 2. Docker Build, Trivy Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Backend Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} capstone-project/backend/

    - name: Build Frontend Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} capstone-project/frontend/

    - name: Run Trivy Scan on Backend Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/backend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy Scan on Frontend Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Push Images to GHCR with Git SHA Tags
      if: github.ref == 'refs/heads/main'
      run: |
        docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
        docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  deploy:
    name: 3. Helm Kubernetes Deployment
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Install Helm
      uses: azure/setup-helm@v3

    - name: Dry-Run Helm Deployment
      run: |
        helm lint capstone-project/helm/taskboard
        helm template taskboard capstone-project/helm/taskboard
