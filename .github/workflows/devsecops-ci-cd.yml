name: Capstone TaskBoard DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 1. Test & Build (pytest & Node)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Run Backend Pytest Suite
      run: |
        cd backend
        pip install -r requirements.txt
        pytest -v

    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Build Frontend Assets
      run: |
        cd frontend
        npm install
        npm run build

  build-scan-push:
    name: 2. Docker Build, Trivy Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set Lowercase Repository Name
      id: repo_name
      run: |
        echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Backend Docker Image
      run: |
        docker build -t ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }} ./backend

    - name: Build Frontend Docker Image
      run: |
        docker build -t ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }} ./frontend

    - name: Run Trivy Security Scan on Backend Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy Security Scan on Frontend Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Push Images to GHCR with Git Commit SHA Tags
      if: github.ref == 'refs/heads/main'
      run: |
        docker push ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
        docker push ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

  deploy:
    name: 3. Helm Kubernetes Package Validation
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Install Helm 3
      uses: azure/setup-helm@v3

    - name: Lint and Validate Helm Chart Templates
      run: |
        helm lint ./helm/taskboard
        helm template taskboard ./helm/taskboard
