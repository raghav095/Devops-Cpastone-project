frontend:
  image: taskboard-frontend
  tag: local
  pullPolicy: IfNotPresent
backend:
  image: taskboard-backend
  tag: local
  pullPolicy: IfNotPresent
replicaCount: 2
namespace: taskboard
imagePullSecrets: []
postgres:
  host: taskboard-postgres
  database: taskboard
  username: taskboard
  password: taskboard
ingress:
  enabled: true
  className: nginx
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
monitoring:
  serviceMonitor:
    enabled: false
