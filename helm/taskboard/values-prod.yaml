frontend:
  image: ghcr.io/raghav095/devops-cpastone-project/taskboard-frontend
  tag: a064de4
  pullPolicy: IfNotPresent
backend:
  image: ghcr.io/raghav095/devops-cpastone-project/taskboard-backend
  tag: a064de4
  pullPolicy: IfNotPresent
replicaCount: 3
namespace: taskboard
postgres:
  host: taskboard-postgres
  database: taskboard
  username: taskboard
  password: taskboard
ingress:
  enabled: true
  className: nginx
  host: taskboard.example.com
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
monitoring:
  serviceMonitor:
    enabled: true
